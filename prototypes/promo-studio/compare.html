<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ModMind / 逐帧对照</title><style>*{box-sizing:border-box}body{margin:0;background:#141a1b;color:#dbe5df;font:14px 'Segoe UI','Microsoft YaHei',sans-serif;padding:25px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:19px;font-weight:500}section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}figure{margin:0}video,canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}figcaption{padding:12px 0;color:#8ea69b}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,input{font:inherit;border:1px solid #496157;background:#263a32;color:#e5eee6;border-radius:5px;padding:8px}button{cursor:pointer}input[type=range]{flex:1;accent-color:#c6a047}input[type=number]{width:95px}small{line-height:1.9;color:#9bab9e}#status{color:#c8b06a}a{color:#bed9c8}</style><header><h1>ModMind / 同步逐帧对照</h1><a href="index.html">成片预览 ↗</a></header><section><figure><video id="ref" src="reference.mp4" preload="auto" muted playsinline></video><figcaption>原片 / 相同帧号</figcaption></figure><figure><canvas width="1920" height="1080"></canvas><figcaption>ModMind / 代码重建</figcaption></figure></section><nav><button id="prev">← 前一帧</button><input id="frame" aria-label="帧号" type="number" min="0" max="2214" value="557"><button id="next">后一帧 →</button><input id="range" aria-label="帧进度" type="range" min="0" max="2214" value="557"><span id="stamp"></span></nav><nav><button data-frame="37">文字波动 · 37</button><button data-frame="453">粒子 · 453</button><button data-frame="557">透视 · 557</button><button data-frame="1657">暗场 · 1657</button></nav><p id="status"></p><small>左右方向键逐帧。比较页只作本地参考，原片不进入导出文件。<br>当前仍有粒子分布、景深和部分未追踪镜头的运动差异，不能据此宣称逐帧一致。</small><script type="module">
import{render,preload,defaults}from'./renderer.js';import{locateFrame}from'./timeline.js';const v=document.querySelector('video'),g=document.querySelector('canvas').getContext('2d'),field=document.querySelector('#frame'),range=document.querySelector('#range');await preload();let f=557,serial=0;async function show(value){f=Math.max(0,Math.min(2214,Math.round(Number(value))));field.value=range.value=f;render(g,f/30,defaults);v.currentTime=(f+.05)/30;const s=locateFrame(f);document.querySelector('#stamp').textContent=`${f} / 2214 · ${(f/30).toFixed(3)} s`;document.querySelector('#status').textContent=`${s.label} · ${s.start}–${s.end-1} 帧`;}document.querySelector('#prev').onclick=()=>show(f-1);document.querySelector('#next').onclick=()=>show(f+1);field.onchange=range.oninput=e=>show(e.target.value);document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>show(b.dataset.frame));document.onkeydown=e=>{if(e.target===field)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(f+(e.key==='ArrowRight'?1:-1))}};if(v.readyState<1)await new Promise(r=>v.addEventListener('loadedmetadata',r,{once:true}));show(new URLSearchParams(location.search).get('frame')||557);
</script></html>
