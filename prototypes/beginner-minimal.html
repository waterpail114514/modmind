    /* Match AgentWorkbench's tokens and controls while retaining the single-column layout. */
    .topbar{height:54px;padding:0 20px}
    .brand{font-size:14px;font-weight:650;gap:8px}
    .brand img{width:24px;height:24px}
    .icon{width:30px;height:30px;border-radius:50%;color:var(--secondary)}
    .project-trigger{font-size:12px;color:var(--secondary)}
    .welcome h1{font-size:29px;font-weight:500;line-height:1.6}
    .welcome img{width:44px;height:44px;margin-bottom:18px}
    .welcome{padding-bottom:26px}
    .thread,.composer{width:min(800px,100%)}
    .message{line-height:1.6}
    .user .bubble{padding:10px 12px;border-radius:8px 0 8px 8px}
    .composer-zone{padding-bottom:16px}
    .composer{min-height:104px;padding:16px;border-radius:20px;box-shadow:none}
    .composer:focus-within{border-color:#b3c7f0}
    :root[data-theme=dark] .composer:focus-within{border-color:#5974a4}
    .composer textarea,.empty .composer textarea{min-height:42px;line-height:20px;padding:0;margin-bottom:8px}
    .composer textarea::placeholder{color:#a1a2aa}
    .composer-bottom{min-height:32px;margin-top:0;gap:8px}
    .composer-left{gap:6px;flex:1}
    .generation-controls{display:flex;align-items:center;gap:6px;min-width:0}
    .preference-control{position:relative;display:flex;align-items:center;height:30px;border-radius:999px;background:var(--hover);color:var(--secondary);flex:none}
    .preference-control:hover{background:var(--line)}
    .preference-control:has(select:disabled){opacity:.5;background:var(--hover)}
    .preference-control select{appearance:none;height:30px;width:140px;padding:0 26px 0 11px;border:0;border-radius:999px;outline-offset:2px;background:transparent;color:inherit;font:inherit;font-size:12px;cursor:pointer}
    .preference-control.reasoning select{width:104px}
    .preference-control select:disabled{cursor:default}
    .preference-control select option{background:var(--surface);color:var(--text)}
    .preference-control>svg{position:absolute;right:9px;width:12px;height:12px;pointer-events:none}
    .draft-status{margin-left:auto;max-width:110px}
    .send{width:32px;height:32px;border-radius:50%;color:#fff}
    :root[data-theme=dark] .send,:root[data-theme=dark] .command.primary{color:#fff}
    .send svg{stroke-width:2.7}
    .send:disabled{color:#fff;background:var(--line)}
    .send.is-running,.send.is-running:hover{color:#f53f3f;background:#ffece8}
    :root[data-theme=dark] .send.is-running{color:#ff8585;background:#502b2d}
    .send.is-running svg{width:13px;height:13px;fill:currentColor}
    .command{min-height:30px;padding:5px 10px;border-radius:5px;color:var(--secondary);font-size:12px}
    .command.primary{color:#fff}
    .text-action{color:var(--secondary)}
    .popover{top:47px;box-shadow:var(--shadow)}
    .more-menu{right:20px}
    .projects-menu{left:149px}
    .menu-item{color:var(--secondary)}
    .result-meta{color:var(--muted)}
    @media(max-width:600px){
      .topbar{height:48px;padding:0 14px}
      .top-left{gap:12px}
      .brand{font-size:14px}
      .project-trigger span{max-width:130px}
      .welcome h1{font-size:29px}
      .composer-zone{padding:0 14px 14px}
      .composer{padding:12px;border-radius:16px}
      .composer-bottom{gap:6px}
      .composer-left,.generation-controls{gap:4px}
      .preference-control select{width:126px;font-size:11px;padding-left:9px;padding-right:21px}
      .preference-control.reasoning select{width:92px}
      .preference-control>svg{right:7px;width:11px;height:11px}
      .draft-status{display:none}
      .projects-menu{left:14px}
      .more-menu{right:14px}
    }
    @media(max-width:360px){.composer{padding:10px}.preference-control select{width:106px}.preference-control.reasoning select{width:80px}.preference-control select{padding-left:8px;padding-right:18px}.preference-control>svg{right:5px}.project-trigger span{max-width:100px}}
    .top-actions{display:flex;align-items:center;gap:14px}
    .mode-toggle{display:flex;align-items:center;gap:7px;color:var(--secondary);font-size:11px;cursor:pointer;white-space:nowrap}
    .mode-toggle input{appearance:none;width:26px;height:16px;border-radius:999px;background:#c9cdd4;margin:0;position:relative;cursor:pointer}
    .mode-toggle input::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff}
    .mode-toggle input:checked{background:var(--accent)}
    .mode-toggle input:checked::after{left:12px}
    .assistant-head img{display:none}
    .assistant-head{color:var(--secondary);font-size:11px;font-weight:500}
    .assistant-copy,.message-actions,.activity{padding-left:0}
    .process,.result,.result-note{margin-left:0}
    .workspace-body{display:flex;flex:1;min-height:0}
    .starter-recommendations{width:min(800px,100%);margin:20px auto 0}
    .starter-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:11px;color:var(--muted)}
    .starter-heading button{display:flex;align-items:center;gap:5px;color:inherit;font-size:11px;padding:4px 0 4px 10px}
    .starter-heading svg{width:12px;height:12px}
    .starter-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .starter-options button{display:flex;align-items:center;justify-content:space-between;gap:9px;min-height:42px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;text-align:left;font-size:12px;line-height:1.6;overflow-wrap:anywhere}
    .starter-options button:hover{background:var(--hover)}
    .starter-options svg{width:14px;height:14px;color:var(--muted)}
    .empty .composer-zone{margin-bottom:max(24px,calc(50dvh - 300px))}
    @media(max-width:600px){.starter-options{grid-template-columns:1fr;gap:6px}.starter-recommendations{margin-top:16px}.empty .composer-zone{margin-bottom:24px}}
    .workspace-body main{min-width:0}
    .expert-sidebar{width:190px;flex:none;border-right:1px solid var(--line);padding:18px 10px;background:var(--soft);overflow:auto}
    .expert-sidebar h2{font-size:11px;font-weight:500;color:var(--muted);padding:0 10px;margin:0 0 14px}
    .expert-sidebar .menu-heading{margin-top:18px}
    .expert-status{padding:12px 10px;font-size:11px;color:var(--muted);line-height:1.8;border-top:1px solid var(--line);margin-top:16px}
    .app.expert .thread,.app.expert .composer{width:calc(100% - 56px);max-width:1100px}
    .app.expert .empty .composer-zone{margin-bottom:0}
    .app.expert .conversation{padding-inline:0}
    .app.expert .composer-zone{padding-inline:0}
    .app.expert.empty .composer-zone{margin-bottom:16px}
    .app.expert .welcome{justify-content:center;padding-bottom:0}
    @media(max-width:600px){.top-actions{gap:5px}.top-left{gap:7px}.brand{font-size:12px}.brand img{width:20px;height:20px}.project-trigger span{max-width:82px}.mode-toggle{font-size:10px;gap:5px}.topbar{padding-inline:12px}.expert-sidebar{width:126px;padding-inline:5px}.app.expert .thread,.app.expert .composer{width:calc(100% - 20px)}.app.expert .generation-controls{flex-wrap:wrap}.app.expert .composer-left{flex-wrap:wrap}.app.expert .composer-bottom{align-items:flex-end}.app.expert .welcome h1{font-size:29px;text-wrap:balance}.expert-sidebar .menu-item{padding:8px 6px;font-size:11px}.expert-sidebar .menu-item small{display:none}}
    .topbar{background:var(--bg);border-bottom:0;box-shadow:none}
    .composer textarea,.empty .composer textarea{font-size:15px;line-height:22px}
    .starter-heading{font-size:12px}
    .starter-heading button{font-size:12px}
    .starter-options button{border:0;border-radius:6px;font-size:13px}
    .empty .composer-zone{margin-bottom:max(24px,calc(50dvh - 165px))}
    @media(max-height:650px),(max-width:600px){.empty .composer-zone{margin-bottom:24px}.preference-control select{font-size:12px}}
  </style>
</head>
<body>
  <div class="app empty" id="app">
    <header class="topbar">
      <div class="top-left">
        <button class="brand" id="home" aria-label="ModMind，新建作品"><img class="brand-image" alt=""><span>ModMind</span></button>
        <span class="divider"></span>
        <button class="project-trigger" id="projects-toggle" aria-expanded="false" aria-controls="projects-menu"><span id="project-title">我的作品</span><i data-icon="ChevronDown"></i></button>
      </div>
      <div class="top-actions"><label class="mode-toggle"><span>专业模式</span><input type="checkbox" id="mode-toggle" aria-label="专业模式"></label><button class="icon tool" id="more-toggle" aria-label="更多" data-tip="更多" aria-expanded="false" aria-controls="more-menu"><i data-icon="Ellipsis"></i></button></div>
      <div class="popover projects-menu" id="projects-menu" hidden>
        <button class="menu-item" data-action="new"><i data-icon="Plus"></i><span>新建作品</span></button>
        <div class="menu-separator"></div><div class="menu-heading">最近作品</div>
        <div class="project-list" id="project-list"></div>
      </div>
      <div class="popover more-menu" id="more-menu" hidden>

      if(flash){[[4,5],[24,21],[7,13]].forEach(([x,y])=>{square(x,y,1,4,c);square(x-1,y+3,2,1,c);square(x-1,y+3,1,3,c);});}
    }
    function preview(index){const p=current(),m=p?.messages[index];if(!m||m.kind!=='result')return;previewColor=m.color;modal(escapeHtml(m.name),`<div class="large-preview"><canvas id="large-canvas" width="32" height="32" role="img" aria-label="${escapeHtml(m.name)} 像素外观预览"></canvas></div><div class="preview-toolbar">${Object.entries(COLORS).map(([key,val])=>`<button class="swatch" style="--swatch:${val}" data-color="${key}" aria-label="${({blue:'蓝色',green:'绿色',purple:'紫色',red:'红色'})[key]}" aria-pressed="${key===m.color}"></button>`).join('')}<span class="spacer"></span><button class="icon tool" id="effect" data-tip="查看特效" aria-label="查看特效">${icon('Zap')}</button><button class="icon tool" id="download-png" data-tip="下载贴图" aria-label="下载贴图">${icon('Download')}</button></div>`,`<button class="command" data-close>返回</button><button class="command primary" id="use-color">应用颜色</button>`);drawItem($('large-canvas'),previewColor,m.item);$('dialog').querySelectorAll('[data-color]').forEach(btn=>btn.onclick=()=>{previewColor=btn.dataset.color;$('dialog').querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));drawItem($('large-canvas'),previewColor,m.item);});let flashing=false;$('effect').onclick=()=>{flashing=!flashing;drawItem($('large-canvas'),previewColor,m.item,flashing);$('effect').setAttribute('aria-pressed',String(flashing));};$('download-png').onclick=()=>{download($('large-canvas').toDataURL('image/png'),`${safeName(m.name)}.png`);};$('use-color').onclick=()=>{if(busy){toast('请先停止当前制作。');return;}const label=({blue:'蓝色',green:'绿色',purple:'紫色',red:'红色'})[previewColor];closeDialog();submit(`把颜色改成${label}`);};}
    function safeName(name){return name.replace(/[<>:"/\\|?*\x00-\x1f]/g,'_').slice(0,60)||'modmind';}
    function download(url,name){const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();}
    function exportResult(index){const p=current(),m=p?.messages[index];if(!m)return;modal('导出作品',`<p class="dialog-copy">${escapeHtml(m.name)} · 第 ${m.revision} 版</p><p class="dialog-copy">当前可导出作品草稿与像素贴图。可安装的模组需要在正式应用中构建。</p>`,`<button class="command" id="export-image">${icon('Image')}贴图 PNG</button><button class="command primary" id="export-draft">${icon('Download')}作品草稿</button>`);$('export-image').onclick=()=>{const c=document.createElement('canvas');c.width=32;c.height=32;drawItem(c,m.color,m.item);download(c.toDataURL('image/png'),`${safeName(m.name)}.png`);toast('已导出贴图');};$('export-draft').onclick=()=>{const data={format:'modmind-preview-draft',version:1,project:p.name,result:m,messages:p.messages.slice(0,index+1)};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));download(url,`${safeName(m.name)}-v${m.revision}.json`);setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出作品草稿');};}
    function handleAction(action){closeMenus();if(action==='new')newProject();if(action==='rename')rename();if(action==='settings')settings();if(action==='account')account();if(action==='resume')run();if(action==='unknown-version'){const p=current();modal('先从推荐版本开始',`<p class="dialog-copy">使用 Minecraft ${escapeHtml(p?.version||'1.20.1')} 和 ${escapeHtml(p?.loader||'Forge')} 创建草稿。</p>`,`<button class="command" data-close>返回</button><button class="command primary" id="use-recommended">使用推荐版本</button>`);$('use-recommended').onclick=()=>{closeDialog();submit(`${p?.version||'1.20.1'} ${p?.loader||'Forge'}`);};}if(action==='advanced')selectUiMode(state.uiMode==='advanced'?'beginner':'advanced');if(action==='expert-files'){const p=current(),index=p?.messages.findLastIndex(m=>m.kind==='result')??-1;if(index>=0)exportResult(index);else modal('作品文件','<p class="dialog-copy">制作完成后，作品文件会显示在这里。</p>','<button class="command" data-close>关闭</button>');}if(action==='test-game')modal('游戏测试',`<p class="dialog-copy">此页面中的作品是交互预览，尚未构建为可运行的模组。</p><p class="dialog-copy">接入正式应用后，这里将直接启动 Minecraft 测试。</p>`,`<button class="command primary" data-close>返回作品</button>`);}
    $('projects-toggle').onclick=()=>toggleMenu('projects');$('more-toggle').onclick=()=>toggleMenu('more');$('home').onclick=newProject;
    $('refresh-starters').onclick=()=>{suggestions=createChatStarters('workbench').suggestions;renderStarters();};
    $('starter-options').onclick=e=>{const option=e.target.closest('[data-starter]');if(option){$('prompt').value=suggestions[Number(option.dataset.starter)].prompt;setDraft();$('prompt').focus();}};
    $('mode-toggle').onchange=e=>selectUiMode(e.target.checked?'advanced':'beginner');
    $('model-select').onchange=e=>{state.model=e.target.value;persist();updatePreferences();};
    $('reasoning-select').onchange=e=>{state.reasoningLevel=e.target.value;persist();updatePreferences();};
    $('composer').onsubmit=e=>{e.preventDefault();submit();};$('prompt').oninput=setDraft;
    $('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&state.enterSend){e.preventDefault();if(!busy)submit();}};
    $('attach').onclick=()=>$('file-input').click();$('file-input').onchange=e=>{addFiles(e.target.files);e.target.value='';};
    $('attachments').onclick=e=>{const b=e.target.closest('[data-remove]');if(b){const [f]=files.splice(Number(b.dataset.remove),1);if(f.preview)URL.revokeObjectURL(f.preview);renderFiles();}};
    let dragDepth=0;$('composer').addEventListener('dragenter',e=>{e.preventDefault();dragDepth++;$('composer').classList.add('dragging');});$('composer').addEventListener('dragover',e=>e.preventDefault());$('composer').addEventListener('dragleave',()=>{if(--dragDepth<=0)$('composer').classList.remove('dragging');});$('composer').addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('composer').classList.remove('dragging');addFiles(e.dataTransfer.files);});
    document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>e.preventDefault());
    document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action)handleAction(action.dataset.action);const project=e.target.closest('[data-project]');if(project)selectProject(project.dataset.project);const del=e.target.closest('[data-delete]');if(del)removeProject(del.dataset.delete);const ver=e.target.closest('[data-version]');if(ver)submit(ver.dataset.version.replace('|',' '));const pv=e.target.closest('[data-preview]');if(pv)preview(Number(pv.dataset.preview));const ex=e.target.closest('[data-export]');if(ex)exportResult(Number(ex.dataset.export));if(e.target.closest('[data-close]'))closeDialog();if(!e.target.closest('.popover,#projects-toggle,#more-toggle'))closeMenus();});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus();if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.closest('.topbar')){const open=document.querySelector('.popover:not([hidden])');if(open){e.preventDefault();const buttons=[...open.querySelectorAll('button:not(:disabled)')];const at=buttons.indexOf(document.activeElement);buttons[(at+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();}}});
    $('dialog').addEventListener('click',e=>{if(e.target===$('dialog')){const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.theme==='system')setTheme('system');});
    document.querySelectorAll('.brand-image').forEach(img=>img.src=LOGO);document.querySelector('.welcome h1').textContent=initialStarters.greeting;renderStarters();hydrateIcons();setTheme(state.theme);$('prompt').value=current()?current().draft||'':state.scratchDraft||'';syncMode();render();updateSend();
  </script>
</body>
</html>
