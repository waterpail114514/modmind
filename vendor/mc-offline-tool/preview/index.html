<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>3D 建筑预览 · 本地资源包 + 物品栏 + 编辑</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- 工具条（P1 工具组模型：1-5 切换工具，Esc 回浏览，当前工具高亮） -->
  <!-- ★★ 布局重设计（2026-10-12）。用户原话：「当前 UI 的功能布局不合理，请重新设计界面布局，
       说明各功能模块的位置与层级关系，并保持原有功能完整性。」

       病根：14 个常驻控件**平铺在一条横条里**，而它们属于四类**作用域完全不同**的东西 ——
       于是「分层」紧挨着「物品栏」（两者毫无关系）、「项目」和「网格」看着同级；
       找按钮时只能"从左边数第几个"，而不是"先想这事属于哪一类"。

       现在按作用域分三段，每段一个段盒，段名用 CSS 的 content:attr(data-lb) 从 data-lb 渲染
       （不在 HTML 里把「工程」再写一遍，只写一处）：

         ① 工程（data-sec=proj）＝ 我在做哪一份？   项目 / 保存状态 / 保存 / 文件
         ② 编辑（data-sec=edit）＝ 我现在在改什么？ 工具 1–5 / 撤销 / 重做 / 整体移到原点
         ③ 视图（data-sec=view）＝ 我怎么看它？     适应建筑 / 网格 / 镜像 / 物品栏 / 分层

       第四类「上下文」（这一刻能做什么）本来就已是浮层，位置不动：
       框选动作条 #selBar 在视口底部居中，投影三个按钮在「文件」下拉里。

       ⚠ 段盒**绝不能加 overflow**：三个下拉的弹层要能溢出到段外，加了就是「下拉被截断」复现。
       ⚠ 元素 id **一个都没动** ⇒ JS 绑定零改动 —— 这是本次重排风险最低的关键。
       ⚠ 窄面板下段是 flex item ⇒ **整段换行**，不会再出现「『文件』单独掉到工具栏最左」那种
         半截换行（那正是 Q8 守着的截断 bug 的成因）。折行优先级 = DOM 顺序 = 工程 > 编辑 > 视图。
         动顶栏请连着跑 preview/.work/check-pop.py（1100–2560 六个宽度）。 -->
  <div id="bar">
    <span class="brand">3D 建筑预览<small>Deepslate · 用户实例资源 · 本地图标</small></span>

    <!-- ① 工程层 -->
    <div class="bar-sec" data-sec="proj" data-lb="工程">
      <!-- 项目组（2026-10-11）：一个下拉承载「当前项目 / 切换 / 新建 / 另存 / 重命名 / 删除」。
           为什么做成下拉而不是平铺：项目是"你正在编辑哪个东西"，比"撤销/网格"这类命令高一层；
           平铺会让二者看起来同级，且按钮越加越多（这正是用户说"按钮过多"的根因）。
           ★ 每个项目独立存档 ⇒ 切换/新建都不会再覆盖上一个项目。 -->
      <span class="grp" id="projGrp">
        <button class="btn grp-head" id="projHead" aria-expanded="false" aria-haspopup="menu"
                title="项目：切换 / 新建 / 重命名 / 删除（各自独立存档，互不覆盖）"><span class="caret"></span>项目：<b id="projName">—</b></button>
        <span class="saveState" id="projSave" title="自动保存状态">—</span>
        <div class="grp-pop wide" id="projPop" hidden role="menu">
          <div class="pop-title">选择项目</div>
          <div class="proj-list" id="projList"></div>
          <div class="pop-sep"></div>
          <button class="btn" id="newBtn" role="menuitem" title="新建一个空项目；当前项目会被保留（不会丢）">＋ 新建项目</button>
          <button class="btn" id="projDup" role="menuitem" title="把当前项目另存为一个副本（当前项目不变）">另存为副本</button>
          <button class="btn" id="projRen" role="menuitem">重命名…</button>
          <button class="btn danger" id="projDel" role="menuitem" title="删除当前项目（不可撤销）">删除当前项目</button>
          <div class="pop-note" id="projUsage"></div>
        </div>
      </span>
      <button class="btn" id="saveBtn" title="立即保存当前项目（Ctrl+S）">保存</button>
      <!-- 文件组：导入 / 投影 / 导出 / 材料清单 合并成一组、默认折叠（用户明确要求） -->
      <span class="grp" id="fileGrp">
        <button class="btn grp-head" id="fileHead" aria-expanded="false" aria-haspopup="menu"
                title="导入建筑 / 导入投影 / 导出 / 材料清单">文件<span class="caret"></span></button>
        <!-- ★ 这里**不写** atright：靠左还是靠右由 placePop() 在每次打开时量算决定。
             写死靠右就是那个「文件下拉被截断」bug 的成因（窗口一宽「文件」单独换行到最左，
             right:0 会把弹层往左甩出面板；实测 1920 宽时 filePop.left = -94）。
             ⚠ 2026-10-12 记一笔：这处改动**曾被变异套件的 restore_all() 静默回滚过一次**
             （备份是"首次运行时"的快照，而我是在备份之后才改的它）——
             所以它现在在套件里有 M6 变异守着（Q8 必红）。改这里请连着跑 check-pop.py。
             ★ 2026-10-12 布局重设计：本组从**左侧物品栏那一列**搬到①工程段。
               原来它在左列时，展开的弹层会**盖住物品栏**（用户截图里正发生着这件事）；
               顶栏横跨整个面板，弹层左边界落在物品栏右边界之右 ⇒ 不再遮挡。
               段盒不带 overflow，弹层照旧能溢出到段外。 -->
        <div class="grp-pop" id="filePop" hidden role="menu">
          <button class="btn" id="importBtn" role="menuitem" title="用文件里的建筑**替换**当前世界（可撤销）">导入建筑…</button>
          <button class="btn" id="projBtn" role="menuitem" title="导入投影：不替换当前世界；载入后可用「按投影补全」把建筑修成投影的样子">导入投影…</button>
          <!-- ★ 2026-10-12：原来这里有三个"投影动作"按钮（按投影补全 / 清除投影 / 隐藏虚影），
               已按作用域分层搬到视口右上的 L3 浮层 #projBar（见下方 #stageWrap 里）。
               搬走的理由：它们回答的是"**这一刻**能做什么"（只有载入投影后才存在），
               而本下拉回答的是"我在操作**哪一份文件**" —— 两个问题不该挤在一个菜单里。
               ⚠ 三个 id 一个都没改，只是换了位置 ⇒ 接线（#projApply.onclick 等）零改动。 -->
          <div class="pop-sep"></div>
          <button class="btn primary" id="expSchem" role="menuitem">导出 .schem</button>
          <button class="btn" id="expLitematic" role="menuitem">导出 .litematic</button>
          <button class="btn" id="matBtn" role="menuitem">材料清单</button>
        </div>
      </span>
    </div>

    <!-- ② 编辑层 -->
    <div class="bar-sec" data-sec="edit" data-lb="编辑">
      <span class="tools" id="toolGroup">
        <button class="tool" id="m_pan"   data-tool="pan"   title="浏览（快捷键 1）"><span class="k">1</span>浏览</button>
        <button class="tool" id="m_place" data-tool="place" title="摆放（快捷键 2）"><span class="k">2</span>摆放</button>
        <button class="tool" id="m_erase" data-tool="erase" title="删除（快捷键 3）"><span class="k">3</span>删除</button>
        <button class="tool" id="m_pick"  data-tool="pick"  title="拾取（快捷键 4）"><span class="k">4</span>拾取</button>
        <button class="tool" id="m_select" data-tool="select" title="框选（快捷键 5）"><span class="k">5</span>框选</button>
      </span>
      <button class="btn" id="undoBtn" title="Ctrl+Z">撤销</button>
      <button class="btn" id="redoBtn" title="Ctrl+Y / Ctrl+Shift+Z">重做</button>
      <!-- 整体布局操作（2026-10-12）：把**整个建筑的内容**挪到原点。
           ★ 布局重设计把它从「文件」下拉里搬出来、直接放在②编辑段：
             它是**编辑动作**（真的在移动方块），不是文件操作 —— 归在"文件"里是归类错了。
             原来收进下拉的理由是"工具条太挤"，现在有了分段，编辑段放得下。
           ★ 与框选动作条里的「选区移到原点」是**两个作用域**：这里 = 全部内容，那里 = 只有选区。
             所以两处文案都写全，不再都叫"移到原点"（同名不同作用域会让人点错）。 -->
      <button class="btn" id="originBtn" title="把当前建筑的**全部内容**整体平移到原点（内容包围盒中心对准用户坐标 0,0,0；一次可撤销）。只想搬选区请用框选后的「选区移到原点」">整体移到原点</button>
    </div>

    <!-- ③ 视图层 -->
    <div class="bar-sec" data-sec="view" data-lb="视图">
      <button class="btn" id="fitBtn" title="快捷键 F">适应建筑</button>
      <button class="btn" id="gridBtn" title="快捷键 G">网格（开）</button>
      <!-- 镜像组：镜像 X / 镜像 Y 合并成一组、默认折叠（用户明确要求） -->
      <span class="grp" id="mirrorGrp">
        <button class="btn grp-head" id="mirrorHead" aria-expanded="false" aria-haspopup="menu"
                title="镜像（绕世界中心线对称）：X = 左右（红轴）、Z = 前后（蓝轴），可同时开。★ Y（上下对称）已移除：它的轴是「世界高度÷2」，而世界只向上长，一往高处建轴就漂"><span class="dot" id="mirrorDot" hidden></span>镜像<span class="caret"></span></button>
        <div class="grp-pop" id="mirrorPop" hidden role="menu">
          <button class="btn" id="mirrorBtn" role="menuitem" title="镜像 X（快捷键 M）：绕世界中心线左右对称（红轴 / 底部东西向那条线）" aria-pressed="false">镜像 X</button>
          <!-- 镜像 Z（2026-10-12 用户要求「底部两条线都加上镜像」）：前后对称，对应蓝色的 Z 轴。
               X 与 Z 同时开 ⇒ 四个方向都对折（最多一次落 4 块）。 -->
          <button class="btn" id="mirrorBtnZ" role="menuitem" title="镜像 Z（快捷键 Shift+M）：绕世界中心线前后对称（蓝轴 / 底部南北向那条线）" aria-pressed="false">镜像 Z</button>
        </div>
      </span>
      <button class="btn" id="invBtn" title="显示 / 隐藏物品栏（快捷键 B）">物品栏</button>
      <label class="hint" title="按世界高度分层显示（0=全部，1=只看最下面 1 层）。★ 与「适应建筑」相互独立：相机不会被分层改动的重建带跑">分层 <input type="range" id="layer" min="0" max="3" value="3" style="vertical-align:middle;width:110px"> <span id="layerVal">全部</span></label>
    </div>

    <span class="spacer"></span>
    <select id="sample" title="内置示例建筑（功能包里没有静态文件，这个下拉会自动隐藏，请用「文件 › 导入建筑…」）">
      <option value="">— 示例建筑 —</option>
      <option value="data/build.json">GTL 模板 7×4×7（87 方块）</option>
      <option value="data/build-schem.json">.schem 样本（粉猪 1989 方块）</option>
      <option value="data/build-litematic.json">.litematic 样本（22 方块）</option>
    </select>
    <input type="file" id="importInput" accept=".nbt,.litematic,.schem" style="display:none">
    <input type="file" id="projInput" accept=".nbt,.litematic,.schem" style="display:none">
  </div>

  <!-- 主体：左物品栏 + 右视口 -->
  <div id="main">
    <div id="inv">
      <div id="invHead">
        <div class="row"><span class="inv-title">物品栏</span><span id="invCount" class="cnt"></span></div>
        <div class="row"><input id="q" placeholder="搜索方块（名称 / ID）" autocomplete="off" spellcheck="false"></div>
        <div class="row">
          <select id="ns" title="按来源（命名空间）筛选"></select>
          <label class="hint" style="white-space:nowrap"><input type="checkbox" id="onlyBlock"> 只看方块</label>
        </div>
        <div id="tabs"></div>
      </div>
      <div id="grid"></div>
      <div id="selLine">未选物品</div>
      <div id="invFoot"></div>
    </div>

    <div id="stageWrap">
      <canvas id="stage"></canvas>
      <!-- 操作提示（浅色主题下纯 text-shadow 会糊 ⇒ 半透明底的浮层）。
           ★ 2026-10-12 布局重设计：文案搬进 #hintTx，**不再**写 #overlay 的 textContent ——
             因为 #overlay 里现在还有一个「收起」按钮，写 textContent 会把按钮一起抹掉。
             （这正是"给浮层加个子元素"时最容易踩的坑：JS 那边一句 textContent = 就全没了。）
           ★ 收起只是"这一次先别挡"：换工具 / 切模式（setTool ⇒ syncHint）会自动回来，
             也可按 H 手动开关。为什么不把开关放工具条上：那就是第 15 个常驻控件 ——
             用户抱怨的正是按钮过多，所以出口放在"碍事的那块东西自己身上"。 -->
      <div id="overlay">
        <span class="tx" id="hintTx"></span>
        <button class="x" id="hintClose" type="button" title="收起操作提示（换工具会自动回来，也可按 H 开关）">×</button>
      </div>
      <div id="selBar" hidden>
        <span class="lb">已选区 <b class="num" id="selCount">0</b> 格</span>
        <button class="btn primary" id="selFill">填充所选方块</button>
        <button class="btn" id="selClear">清空</button>
        <button class="btn" id="selMove" title="把选区里的方块**整体搬回原点**（中心对齐 + 贴地；一次可撤销）。只搬整个建筑请用顶栏②编辑段的「整体移到原点」">选区移到原点</button>
        <button class="btn" id="selCancel">取消</button>
      </div>
      <!-- L3 上下文浮层 · 投影（2026-10-12 落地布局方案 4-3）。
           层级定位：**L3 = 上下文层**，与框选动作条同族 —— 只在相关状态下出现，不占常驻位。
           · 无投影 ⇒ 整条 #projBar 收起（hidden），用户完全看不到这三个按钮；
           · 载入投影 ⇒ 现出「按投影补全（N 块）/ 清除投影 / 隐藏虚影」。
           位置：视口**右上、ViewCube 正下方**。为什么不放底部 —— 底部整条被 #err 占着，
           而框选动作条居中在底部；左上角是操作提示条。这是视口里唯一不打架的空位。
           ⚠ 三个 id 与原「文件」下拉里**完全一致** ⇒ JS 只多了一行"整条浮层的显隐"。 -->
      <div class="proj-bar" id="projBar" hidden>
        <span class="pb-title" title="投影（虚影）相关操作：只在载入投影后出现">投影</span>
        <button class="btn" id="projApply" title="把当前建筑按投影补全（缺的补上、错的替换；一次可撤销；只补不删）">按投影补全</button>
        <button class="btn" id="projClear" title="卸载投影（不影响当前建筑）">清除投影</button>
        <button class="btn" id="projHide" title="只把虚影收起来（投影仍保留，随时可以再显示）">隐藏虚影</button>
      </div>
      <!-- ViewCube（2026-10-11）：替代原来的「旋转 90°」按钮。
           点面/棱/角 = 切到对应正视角（26 个方向），拖拽 = 连续环绕，双击 = 复位。
           为什么做成小方块而不是"再来几个按钮"：用户要的是 3D 建模软件那种"看方向 + 一下切过去"，
           按钮只能表达有限的几个方向，而且会继续加按钮。 -->
      <!-- 坐标轴指示器（2026-10-12 用户问"z 轴不都是竖着的吗"之后加的）：
           起因是**轴没有字母、只能靠颜色猜**，而颜色约定（X 红 / Y 绿 / Z 蓝）是 Minecraft 的、
           不是所有 3D 软件都这样（Blender/3ds Max 是 Z 竖直）。加字母后一眼可辨，也就不会再认错。
           方向由 JS 每帧按视图矩阵算（见 viewport.js 的 axisScreenDirs）—— 不是写死的三根线。 -->
      <div id="axisGizmo" aria-label="坐标轴方向指示（红 X / 绿 Y 竖直 / 蓝 Z）">
        <span class="axl axl-x"><i>X</i></span>
        <span class="axl axl-y"><i>Y</i></span>
        <span class="axl axl-z"><i>Z</i></span>
      </div>
      <div id="vcube" tabindex="0" title="视角：点面/棱/角切到该方向 · 拖拽连续旋转 · 双击复位">
        <canvas id="vcubeCv" width="184" height="184"></canvas>
      </div>
      <div id="err"></div>
      <div id="busy"></div>
    </div>
  </div>

  <!-- 状态行（P3：反馈收敛为一条 —— 最近操作 · 坐标 · 操作数 · 历史 ↶N ↷M · 方块） -->
  <div id="status">
    <span id="msg"></span>
    <span class="spacer"></span>
    <span class="grp" title="当前指向的格子坐标（悬停时更新）。原点在网格正中 ⇒ 坐标可为负"><i>坐标</i><b id="stCoord">—</b></span>
    <span class="grp" title="当前网格尺寸 W×H×D（往网格外放方块会自动长大，无上限）"><i>尺寸</i><b id="stSize">—</b></span>
    <span class="grp" title="操作数 = 已提交的操作次数（一组拖拽记 1 次）；撤销/重做不增加"><i>操作数</i><b id="stRev">0</b></span>
    <span class="grp" title="↶ 可撤销 N 步 / ↷ 可重做 M 步（与左「操作数」不是同一口径）"><i>历史</i><b id="stHist">↶0 ↷0</b></span>
    <span class="grp" title="当前世界的方块总数"><i>方块</i><b id="stBlocks">—</b></span>
  </div>
</div>

<!-- 材料清单 -->
<div id="dlg">
  <div id="dlgBox">
    <header><b>材料清单</b><span class="spacer"></span><button class="btn" id="dlgClose">关闭</button></header>
    <div class="body" id="dlgBody"></div>
    <footer><button class="btn primary" id="dlgCsv">下载 CSV</button></footer>
  </div>
</div>

<!-- 依赖：两个 UMD（自包含）+ 不透明表；assets.js/atlas.png 改成**按需**：
     优先走 /api/scene 只打包当前建筑用到的贴图；服务端不可用时才懒加载 data/assets.js 回落。 -->
<script src="vendor/gl-matrix.js"></script>
<script src="vendor/deepslate.umd.cjs"></script>
<script src="data/opaque.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
