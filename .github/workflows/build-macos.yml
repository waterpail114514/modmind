name: Validate macOS
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, arch: arm64, machine: arm64 }
          - { runner: macos-15-intel, arch: x64, machine: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned MCP test suite
        uses: actions/checkout@v4
        with:
          repository: waterpail114514/ModMind-MCP
          ref: f21d65950f255243e941554d1463729ad1056b41
          path: modmind-mcp-open-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Assert native runner architecture
        run: |
          node -p "process.platform + '-' + process.arch"
          uname -m
          sw_vers
          test "$(node -p process.arch)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.machine }}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package unsigned test artifacts
        run: node scripts/build-macos.mjs --allow-unsigned --arch ${{ matrix.arch }}
      - name: Verify packaged dependencies and managed runtimes
        run: node scripts/smoke-macos-app.mjs
      - name: Verify both archives
        run: npm run verify:mac -- --allow-unsigned --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: ModMind-${{ matrix.arch }}-unsigned-test-only
          path: |
            release/*.dmg
            release/*.zip
            release/SHA256SUMS.txt
            test-results/macos-*-smoke.json
          if-no-files-found: error
          retention-days: 7
